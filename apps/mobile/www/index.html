<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>집어줌</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #fff; color: #0f1f1a; text-align: center; }
      main { padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #6f7f7a; font-size: 15px; line-height: 1.6; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #059669; color: #fff; font-size: 16px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결을 확인해주세요</h1>
      <p>집어줌에 연결하지 못했어요.<br />연결된 뒤 다시 시도해주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
